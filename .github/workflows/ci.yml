name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly resilience runs from the latest default-branch commit; cron is UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.6.0
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  quality:
    name: Format, modules, lint, and security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted_file="$(mktemp)"
          trap 'rm -f "$unformatted_file"' EXIT
          git ls-files -z -- '*.go' |
            while IFS= read -r -d '' file; do
              case "$file" in
                _studies/*|_proposals/*|_rcodegen/*|_bugs_open/*|_bugs_fixed/*|.omx/*) continue ;;
              esac
              gofmt -l "$file" >>"$unformatted_file"
            done
          if [[ -s "$unformatted_file" ]]; then
            echo 'These tracked Go files need gofmt:' >&2
            cat "$unformatted_file" >&2
            exit 1
          fi

      - name: Verify per-file test version gates
        shell: bash
        run: |
          set -euo pipefail
          missing_file="$(mktemp)"
          trap 'rm -f "$missing_file"' EXIT
          git ls-files -z -- '*_test.go' |
            while IFS= read -r -d '' file; do
              case "$file" in
                _studies/*|_proposals/*|_rcodegen/*|_bugs_open/*|_bugs_fixed/*|.omx/*) continue ;;
              esac
              if ! grep -Eq '(^|[^[:alnum:]_])([[:alpha:]_][[:alnum:]_]*\.)?RequireMajor[[:space:]]*\([[:space:]]*11[[:space:]]*\)' "$file"; then
                printf '%s\n' "$file" >>"$missing_file"
              fi
            done
          if [[ -s "$missing_file" ]]; then
            echo 'These tracked test files are missing a RequireMajor(11) gate:' >&2
            cat "$missing_file" >&2
            exit 1
          fi

      - name: Verify modules
        run: |
          set -euo pipefail
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install pinned analysis tools
        run: |
          set -euo pipefail
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        run: golangci-lint run --default=none --enable=govet --enable=ineffassign --enable=unused ./...

      - name: Vulnerability scan
        run: govulncheck ./...

  test:
    name: Tests, race detector, coverage, E2E, and fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare diagnostics directory
        run: mkdir -p artifacts/deterministic

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -timeout=120s -count=1 ./... 2>&1 | tee artifacts/deterministic/go-test.log
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Race test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          go test -race -timeout=180s -count=1 ./... 2>&1 | tee artifacts/deterministic/go-test-race.log
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Enforce statement coverage
        shell: bash
        run: |
          set -euo pipefail
          set +e
          CHASSIS_COVERAGE_PROFILE=artifacts/deterministic/coverage.out \
            ./scripts/check-coverage.sh 2>&1 | tee artifacts/deterministic/coverage-summary.txt
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Process/TCP and Docker E2E
        shell: bash
        run: |
          set -euo pipefail
          set +e
          CHASSIS_E2E_DOCKER_REQUIRED=1 ./scripts/test-e2e.sh 2>&1 | tee artifacts/deterministic/e2e.log
          status="${PIPESTATUS[0]}"
          set -e
          exit "$status"

      - name: Fuzz malformed static keys
        run: go test ./authkit -run='^$' -fuzz='^FuzzParseStaticKeysNeverPanics$' -fuzztime=10s

      - name: Fuzz malformed seal envelopes
        run: go test ./seal -run='^$' -fuzz='^FuzzDecryptEnvelopeNeverPanics$' -fuzztime=10s

      - name: Fuzz malformed webhook inputs
        run: go test ./webhook -run='^$' -fuzz='^FuzzVerifyWebhookNeverPanics$' -fuzztime=10s

      - name: Upload deterministic diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-diagnostics
          path: artifacts/deterministic
          if-no-files-found: warn

  cross-build:
    name: Cross-build and schema proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...

      - name: Cross-build Linux arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      - name: Cross-build Darwin arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

      - name: Compile schemakit for Linux 386
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$(mktemp)"
          trap 'rm -f "$test_binary"' EXIT
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go test -c -o "$test_binary" ./schemakit

  live-integration:
    name: Live integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        service: [redpanda, qdrant, meilisearch, otel-collector, inngest]
    env:
      CHASSIS_INTEGRATION_SERVICES: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare live diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/live/${{ matrix.service }}"
          awk -F '\t' -v svc='${{ matrix.service }}' 'BEGIN{found=0} $1==svc {found++; print "service=" $1 "\nimage=" $2 "\namd64_manifest=" $3 "\narm64_manifest=" $4 "\nsource=" $5} END{if(found!=1) exit 1}' \
            testing/integration-images.tsv | tee "artifacts/live/${{ matrix.service }}/image.txt"
          docker version | tee "artifacts/live/${{ matrix.service }}/docker-version.txt"
          go version | tee "artifacts/live/${{ matrix.service }}/go-version.txt"

      - name: Run exactly selected live integration suite
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'service=%s\nstarted_at=%s\nselector=%s\n' \
            '${{ matrix.service }}' "$started_at" "$CHASSIS_INTEGRATION_SERVICES" \
            | tee "artifacts/live/${{ matrix.service }}/run-metadata.txt"
          set +e
          ./scripts/test-integration.sh "${{ matrix.service }}" 2>&1 | tee "artifacts/live/${{ matrix.service }}/go-test-json.log"
          status="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'finished_at=%s\nstatus=%s\n' "$finished_at" "$status" | tee -a "artifacts/live/${{ matrix.service }}/run-metadata.txt"
          exit "$status"

      - name: Collect live diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          ./scripts/cleanup-ci-docker.sh "artifacts/live/${{ matrix.service }}" 300

      - name: Upload live diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-${{ matrix.service }}-diagnostics
          path: artifacts/live/${{ matrix.service }}
          if-no-files-found: warn

  nightly-resilience:
    name: Nightly resilience and diagnostics
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run scheduled/manual resilience suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nightly
          CHASSIS_NIGHTLY_ARTIFACT_DIR=artifacts/nightly \
          CHASSIS_FUZZTIME=60s \
          CHASSIS_NIGHTLY_RACE_COUNT=3 \
          CHASSIS_NIGHTLY_INTEGRATION_COUNT=2 \
          CHASSIS_NIGHTLY_INTEGRATIONS=all \
          CHASSIS_NIGHTLY_RESTART_SERVICES='redpanda qdrant meilisearch otel-collector inngest' \
            ./scripts/run-nightly-ci.sh

      - name: Collect nightly diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          ./scripts/cleanup-ci-docker.sh artifacts/nightly 500

      - name: Upload nightly diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-resilience-diagnostics
          path: |
            artifacts/nightly
            artifacts/nightly.log
          if-no-files-found: warn
